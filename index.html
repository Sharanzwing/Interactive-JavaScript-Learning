<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Length of Your Text</title>
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Main Card -->
        <main class="card">
            <!-- Header Section -->
            <header class="header">
                <div class="icon-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 7 4 4 20 4 20 7"></polyline>
                        <line x1="9" y1="20" x2="15" y2="20"></line>
                        <line x1="12" y1="4" x2="12" y2="20"></line>
                    </svg>
                </div>
                <h1 class="title">Find the length of your text</h1>
                <p class="subtitle">Enter any text or paragraph below to calculate its total character length.</p>
            </header>

            <!-- Input Form / Area -->
            <div class="input-section">
                <label for="text-input" class="input-label">Your Text</label>
                <div class="textarea-wrapper">
                    <textarea 
                        id="text-input" 
                        class="text-area" 
                        rows="6" 
                        placeholder="Type or paste your text here..."></textarea>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="button-group">
                <button id="find-btn" class="btn btn-primary" type="button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    Find Length
                </button>
                <button id="clear-btn" class="btn btn-secondary" type="button">
                    Clear
                </button>
            </div>

            <!-- Result Display Section -->
            <section id="result-box" class="result-card" aria-live="polite">
                <div class="result-info">
                    <span class="result-label">Total Character Count</span>
                    <div class="result-value-wrapper">
                        <span id="char-count" class="result-count">0</span>
                        <span class="result-unit">characters</span>
                    </div>
                </div>
            </section>
        </main>
        
        <!-- Footer / Project Tag -->
        <footer class="footer">
            <p>JavaScript Practice Project &bull; String Methods</p>
        </footer>
    </div>

    <!-- Link your JavaScript file here -->
    <script src="script.js"></script>
</body>
</html>
